<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Warehouse Dashboard</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    /* Background Image */
    background: url("background apec.png") no-repeat center center fixed;
    background-size: cover;


    color:#fff;
    overflow-x:hidden;
}

/* Floating background glow */

body::before{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    background:#2563eb;
    filter:blur(180px);
    opacity:.15;
    top:-250px;
    right:-150px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:#0ea5e9;
    filter:blur(180px);
    opacity:.12;
    bottom:-250px;
    left:-150px;
    z-index:-1;
}

.container{
    width:95%;
    max-width:1450px;
    display:flex;
    gap:25px;
    padding:25px;

   background:rgba(7,18,38,.72);
    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,.18);
    border-radius:24px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.left{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

.left{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* APEC Banner */
.apec-banner{
    width:100%;
    display:flex;
    justify-content:flex-start;
    margin-bottom:20px;
}

.apec-banner img{
    width:100%;
    max-width:520px;
    border-radius:18px;
    filter:drop-shadow(0 0 20px rgba(59,130,246,.45));

    transition:.4s;
}

.apec-banner img:hover{
    transform:scale(1.03);
    filter:drop-shadow(0 0 35px rgba(59,130,246,.8));
}

@keyframes apecFloat{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-8px);
    }
    100%{
        transform:translateY(0px);
    }
}

.left img{

    width:100%;
    max-width:520px;

    border-radius:15px;

    border:2px solid #2563eb;

    box-shadow:
    0 0 25px rgba(37,99,235,.35);

    

    transition:.4s;
}

.left img:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 40px rgba(59,130,246,.6);
}

@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0);
    }

}



.right{

    flex:1.2;

}

h1{

    text-align:center;

    color:#f8fafc;

    font-size:38px;

    margin-bottom:10px;

    letter-spacing:1px;

}

#clock{

    text-align:center;

    color:#60a5fa;

    font-size:20px;

    margin-bottom:25px;

    font-weight:bold;

}

.menu{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;

}

.menu a{

    text-decoration:none;

    color:white;

    padding:18px;

    border-radius:14px;

    text-align:center;

    font-size:17px;

    font-weight:bold;

    transition:.35s;

    position:relative;

    overflow:hidden;

    box-shadow:0 8px 20px rgba(0,0,0,.35);


}

.menu a::before{

    content:"";

    position:absolute;

    top:0;

    left:-120%;

    width:100%;

    height:100%;

    background:rgba(255,255,255,.15);

    transform:skewX(-25deg);

    transition:.6s;
 
}

.menu a:hover::before{

    left:130%;
}

.menu a:hover{

    transform:translateY(-6px);

    box-shadow:0 15px 25px rgba(37,99,235,.35);

}

/* Button Colors */

.menu a:nth-child(1){background:#2563eb;}
.menu a:nth-child(2){background:#059669;}
.menu a:nth-child(3){background:#ea580c;}
.menu a:nth-child(4){background:#dc2626;}
.menu a:nth-child(5){background:#0891b2;}
.menu a:nth-child(6){background:#7c3aed;}
.menu a:nth-child(7){background:#16a34a;}
.menu a:nth-child(8){background:#d97706;}
.menu a:nth-child(9){background:#be123c;}
.menu a:nth-child(10){background:#4f46e5;}
.menu a:nth-child(11){background:#0d6020;}

.menu a{
    opacity:0;
    animation:slideUp .6s forwards;
}

.menu a:nth-child(1){animation-delay:.1s;}
.menu a:nth-child(2){animation-delay:.2s;}
.menu a:nth-child(3){animation-delay:.3s;}
.menu a:nth-child(4){animation-delay:.4s;}
.menu a:nth-child(5){animation-delay:.5s;}
.menu a:nth-child(6){animation-delay:.6s;}
.menu a:nth-child(7){animation-delay:.7s;}
.menu a:nth-child(8){animation-delay:.8s;}
.menu a:nth-child(9){animation-delay:.9s;}
.menu a:nth-child(10){animation-delay:1s;}
.menu a:nth-child(11){animation-delay:1s;}

@keyframes slideUp{

    from{

        opacity:0;

        transform:translateY(30px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

@media(max-width:900px){

.container{

    flex-direction:column;

}

.menu{

    grid-template-columns:1fr;

}

h1{

    font-size:30px;

}

.left img{

    max-width:100%;

}


}

/* Team Banner */
.team-banner{
    margin-top:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    animation:fadeIn 1s ease;
}

.team-banner img{
    width:100%;
    max-width:550px;
    border-radius:18px;
    border:2px solid #22c55e;
    box-shadow:
        0 0 20px rgba(34,197,94,.35),
        0 12px 30px rgba(0,0,0,.4);

    transition:.4s ease;
}

.team-banner img:hover{
    transform:scale(1.03);
    box-shadow:
        0 0 35px rgba(34,197,94,.6),
        0 15px 35px rgba(0,0,0,.5);
}

/* Clickable Image */

.schedule-button{
    width:340px;
    cursor:pointer;
    border-radius:12px;
    transition:.3s;
    box-shadow:0 0 10px rgba(0,0,0,.3);
}

.schedule-button:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px #00bfff;
}

/* Modal */

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.85);
    justify-content:center;
    align-items:center;
}

.modal-content{
    max-width:90%;
    max-height:90%;
    border-radius:12px;
    animation:zoom .3s;
}

.model{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.85);
    justify-content:center;
    align-items:center;
}

.model-content{
    max-width:90%;
    max-height:90%;
    border-radius:12px;
    animation:zoom .3s;
}

.modol{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.85);
    justify-content:center;
    align-items:center;
}

.modol-content{
    max-width:90%;
    max-height:90%;
    border-radius:12px;
    animation:zoom .3s;
}

.close{
    position:absolute;
    top:20px;
    right:40px;
    color:white;
    font-size:45px;
    cursor:pointer;
}

@keyframes zoom{
    from{transform:scale(.5);}
    to{transform:scale(1);}
}

/* Animated Dashboard Buttons */
.schedule-btn,
.count-btn,
.payroll-btn{
    width:350px;
    height:65px;
    border:none;
    border-radius:14px;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    position:relative;
    overflow:hidden;

    background:#2563eb;

    box-shadow:0 8px 20px rgba(0,0,0,.35);

    transition:.35s;

    opacity:0;
    animation:slideUp .6s forwards;
}

/* Different colors */
.schedule-btn{
    background:#cc0ee9;
    animation-delay:1.1s;
}

.count-btn{
    background:#4f3aed;
    animation-delay:1.2s;
}

.payroll-btn{
    background:#dc2626;
    animation-delay:1.3s;
}

/* Shine Animation */
.schedule-btn::before,
.count-btn::before,
.payroll-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,.18);
    transform:skewX(-25deg);
    transition:.6s;
}

.schedule-btn:hover::before,
.count-btn:hover::before,
.payroll-btn:hover::before{
    left:130%;
}

/* Hover Animation */
.schedule-btn:hover,
.count-btn:hover,
.payroll-btn:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 25px rgba(37,99,235,.35);
}

.schedule-btn:active,
.count-btn:active,
.payroll-btn:active{
    transform:scale(.97);
}

.schedule-btn .icon,
.count-btn .icon,
.payroll-btn .icon{
    font-size:26px;
}


/* Popup */

.modal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.85);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.modal-box{
    position:relative;
    animation:zoom .25s ease;
}

.modal-box img{
    max-width:90vw;
    max-height:90vh;
    border-radius:12px;

}

    position:absolute;
    top:-15px;
    right:-15px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:red;
    color:white;
    font-size:28px;
    text-align:center;
    line-height:40px;
    cursor:pointer;
    font-weight:bold;
}

@keyframes zoom{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.modol-box{
    position:relative;
    animation:zoom .25s ease;
}

.modol-box img{
    max-width:90vw;
    max-height:90vh;
    border-radius:12px;
    box-shadow:0 0 25px #00c6ff;
}

.model-box{
    position:relative;
    animation:zoom .25s ease;
}

.model-box img{
    max-width:90vw;
    max-height:90vh;
    border-radius:12px;
    box-shadow:0 0 25px #00c6ff;
}

.calendar-box{
    margin-top:25px;
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    box-shadow:0 10px 20px rgba(0,0,0,.35);
}

.calendar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.calendar-header h3{
    color:#fff;
    font-size:22px;
}

.calendar-header button{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

.calendar-header button:hover{
    background:#1d4ed8;
}

.calendar-days,
.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    text-align:center;
}

.calendar-days div{
    font-weight:bold;
    color:#60a5fa;
    padding:8px 0;
}

.calendar-grid div{
    padding:12px 0;
    border-radius:8px;
    background:#0f172a;
    color:white;
    cursor:pointer;
    position:relative;
    transition:.3s;
}

.calendar-grid div:hover{
    background:#1e3a8a;
}

.calendar-grid .has-note::after{
    content:"📌";

.calendar-grid .today{
    background:#22c55e;
    font-weight:bold;
}

.calendar-grid .empty{
    background:transparent;
}

</style>

<style>

/* ================================
   UNIVERSAL ANIMATED BUTTON STYLE
   ================================ */

.menu button,
.calendar-header button{
    position:relative;
    overflow:hidden;
    isolation:isolate;
}

/* Moving shine effect */
.menu button::before{
    content:"";
    position:absolute;
    top:0;
    left:-130%;
    width:70%;
    height:100%;
    background:linear-gradient(
        110deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );
    transform:skewX(-25deg);
    transition:left .7s ease;
    z-index:-1;
}

.menu button:hover::before{
    left:150%;
}

/* Floating glow */
.menu button:hover{
    transform:translateY(-7px) scale(1.02);
    filter:brightness(1.15);
    box-shadow:
        0 12px 28px rgba(0,0,0,.45),
        0 0 20px rgba(96,165,250,.45);
}

/* Click animation */
.menu button:active{
    transform:translateY(-1px) scale(.96);
    transition:.08s;
}

/* Gentle breathing animation */
.menu button{
    animation:
        slideUp .6s forwards,
        buttonPulse 3s ease-in-out infinite;
}

/* Keep the original staggered entrance delays */
.popup-btn{
    animation-delay:0s, 2s;
}

.popup-link:nth-of-type(1){animation-delay:.1s, 2.1s;}
.popup-link:nth-of-type(2){animation-delay:.2s, 2.2s;}
.popup-link:nth-of-type(3){animation-delay:.3s, 2.3s;}
.popup-link:nth-of-type(4){animation-delay:.4s, 2.4s;}
.popup-link:nth-of-type(5){animation-delay:.5s, 2.5s;}
.popup-link:nth-of-type(6){animation-delay:.6s, 2.6s;}
.popup-link:nth-of-type(7){animation-delay:.7s, 2.7s;}
.popup-link:nth-of-type(8){animation-delay:.8s, 2.8s;}
.popup-link:nth-of-type(9){animation-delay:.9s, 2.9s;}
.popup-link:nth-of-type(10){animation-delay:1s, 3s;}
.popup-link:nth-of-type(11){animation-delay:1.1s, 3.1s;}

.schedule-btn{animation-delay:1.2s, 3.2s;}
.count-btn{animation-delay:1.3s, 3.3s;}
.payroll-btn{animation-delay:1.4s, 3.4s;}

@keyframes buttonPulse{
    0%,100%{
        box-shadow:0 8px 20px rgba(0,0,0,.35);
    }
    50%{
        box-shadow:
            0 10px 25px rgba(0,0,0,.4),
            0 0 14px rgba(255,255,255,.18);
    }
}

/* Animated calendar navigation buttons */
.calendar-header button{
    transition:.3s ease;
}

.calendar-header button:hover{
    transform:scale(1.12) rotate(3deg);
    box-shadow:0 0 18px rgba(96,165,250,.65);
}

.calendar-header button:active{
    transform:scale(.9);
}

/* Respect reduced-motion settings */
@media (prefers-reduced-motion: reduce){
    .menu button,
    .calendar-header button{
        animation:none !important;
        transition:none !important;
    }
}

.popup-btn{
    grid-column:1 / -1;      /* Span across both columns */
    width:100%;
    background:#0057b8;
    color:white;
    border:none;
    padding:18px;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.35s;
    box-shadow:0 8px 20px rgba(0,0,0,.35);

    display:flex;
    justify-content:center;
    align-items:center;
}

.popup-btn:hover{
    background:#ff6b00;
    transform:translateY(-6px);
    box-shadow:0 15px 25px rgba(37,99,235,.35);
}

.popup-link{
    width:100%;
    border:none;
    color:white;
    padding:18px;
    border-radius:14px;
    text-align:center;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.35s;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    background:#2563eb;
}

.popup-link:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 25px rgba(37,99,235,.35);
    filter:brightness(1.12);
}

</style>

</head>

<script>

function openCount(){
    document.getElementById("countModol").style.display="flex";
}

function closeCount(){
    document.getElementById("countModol").style.display="none";
}

window.onclick = function(event){

    const schedule = document.getElementById("scheduleModal");
    const count = document.getElementById("countModol");
     const payroll = document.getElementById("payrollModel");

    if(event.target === schedule){
        schedule.style.display = "none";
    }

    if(event.target === count){

   if(event.target === payroll){

}

<script>
const calendar = document.getElementById("calendar");
const monthYear = document.getElementById("monthYear");

let currentDate = new Date();



function renderCalendar(){

    calendar.innerHTML="";

    const year=currentDate.getFullYear();
    const month=currentDate.getMonth();

    const firstDay=new Date(year,month,1).getDay();
    const lastDate=new Date(year,month+1,0).getDate();

    monthYear.innerHTML=currentDate.toLocaleString("default",{
        month:"long",
        year:"numeric"
    });

    for(let i=0;i<firstDay;i++){
        calendar.innerHTML+='<div class="empty"></div>';
    }

    const today=new Date();

    for(let d=1;d<=lastDate;d++){

       const day = document.createElement("div");
day.textContent = d;

const dateKey =
    year + "-" +
    String(month + 1).padStart(2,"0") + "-" +
    String(d).padStart(2,"0");

// Show 📌 if note exists
if(notes[dateKey]){
    day.classList.add("has-note");
    day.title = notes[dateKey];
}

// Click to edit note
day.onclick = function(){
    addNote(dateKey);
};

        if(
            d===today.getDate() &&
            month===today.getMonth() &&
            year===today.getFullYear()
        ){
            day.classList.add("today");
        }

        calendar.appendChild(day);
    }
}

function changeMonth(step){
    currentDate.setMonth(currentDate.getMonth()+step);
    renderCalendar();
}

// Save notes
let notes = JSON.parse(localStorage.getItem("calendarNotes")) || {};

function addNote(dateKey){

    const current = notes[dateKey] || "";

    const note = prompt("Enter your note:", current);

    if(note === null) return;

    if(note.trim() === ""){
        delete notes[dateKey];
    }else{
        notes[dateKey] = note;
    }

    localStorage.setItem("calendarNotes", JSON.stringify(notes));
    renderCalendar();
}

renderCalendar();
</script>

<script>
function openApecValues(){

    const width = 1100;
    const height = 750;

    const left = (screen.width - width) / 2;
    const top = (screen.height - height) / 2;

    window.open(
        "apecvalues.html",
        "APECValues",
        `width=${width},
        height=${height},
        top=${top},
        left=${left},
        resizable=yes,
        scrollbars=yes,
        toolbar=no,
        menubar=no,
        location=no,
        status=no`
    );

}
</script>


<script>
/* Open every dashboard link in a centered popup window */
function openLinkPopup(url, windowName){
    const width = Math.min(1200, screen.width - 80);
    const height = Math.min(850, screen.height - 120);
    const left = Math.max(0, (screen.width - width) / 2);
    const top = Math.max(0, (screen.height - height) / 2);

    window.open(
        url,
        windowName,
        `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes,toolbar=no,menubar=no,location=yes,status=no`
    );
}
</script>
